<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Cartão de Visita</title>
  
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="cartao" data-aos="flip-left">
    <img src="image.png" alt="Foto de perfil" class="foto">
    
    <h1 class="nome" data-aos="fade-up" > David Rocha </h1>
    <p class="frase" data-aos="fade-up" >Sua frase de efeito aqui</p> 
    
    <button id="botao-magico">Clique em mim</button>
    <p id="resultado"></p>
  </main>

  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script src="script.js"></script>
</body>
</html>
